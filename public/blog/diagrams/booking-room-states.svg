<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Room states: available, held, booked, released">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fb6ff"/></marker></defs>
<rect width="800" height="400" rx="18" fill="#050816"/>
<text x="28" y="40" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="1.5" fill="#1fb6ff">ROOM STATES DURING A BOOKING</text>
<rect x="40" y="120" width="170" height="80" rx="14" fill="#0b1330" stroke="#34d399" stroke-width="2"/><text x="125.0" y="156.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef2ff">Available</text><text x="125.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3c7">free to book</text><rect x="300" y="120" width="190" height="80" rx="14" fill="#0b1330" stroke="#fbbf24" stroke-width="2"/><text x="395.0" y="156.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef2ff">Held</text><text x="395.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3c7">processing, 10 min</text><rect x="590" y="120" width="170" height="80" rx="14" fill="#0b1330" stroke="#1fb6ff" stroke-width="2"/><text x="675.0" y="156.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef2ff">Booked</text><text x="675.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3c7">payment confirmed</text><rect x="300" y="280" width="190" height="70" rx="14" fill="#0b1330" stroke="#f87171" stroke-width="2"/><text x="395.0" y="311.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef2ff">Released</text><text x="395.0" y="333.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3c7">timeout or failed</text><line x1="210" y1="160" x2="300" y2="160" stroke="#1fb6ff" stroke-width="2.5" marker-end="url(#ah)"/><text x="255.0" y="152.0" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#94a3c7">start booking</text><line x1="490" y1="160" x2="590" y2="160" stroke="#1fb6ff" stroke-width="2.5" marker-end="url(#ah)"/><text x="540.0" y="152.0" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#94a3c7">webhook ok</text><line x1="395" y1="200" x2="395" y2="280" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/><text x="395.0" y="232.0" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#94a3c7">expires</text><line x1="300" y1="315" x2="125" y2="200" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/><text x="212.5" y="249.5" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#94a3c7">back to pool</text>
